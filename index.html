<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Котопрыг</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600&display=swap">
<style>
/* Layout: one arcade screen in a bezel, controls below it. Committed single look: rooftops at night. */
:root {
  --bg: #120d1f;
  --bezel: #1d1530;
  --ink: #f3e9ff;
  --muted: #a898c4;
  --accent: #ff9f43;
  --line: #3a2c57;
  --pixel: 'Press Start 2P', ui-monospace, monospace;
  --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--body);
  font-size: 15px;
  margin: 0;
  padding-inline: 16px;
  padding-block: 20px;
  box-sizing: border-box;
}
.wrap { max-width: 960px; margin: 0 auto; display: grid; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; }
h1 { font-family: var(--pixel); font-size: clamp(16px, 4vw, 24px); color: var(--accent); margin: 0; letter-spacing: 1px; text-wrap: balance; }
header p { margin: 0; color: var(--muted); }
.screen { background: var(--bezel); border: 3px solid var(--line); border-radius: 10px; padding: 8px; }
canvas {
  display: block; width: 100%; height: auto; aspect-ratio: 384 / 224; max-width: 100%;
  image-rendering: pixelated; image-rendering: crisp-edges;
  background: #000; border-radius: 4px; touch-action: none; cursor: pointer;
}
canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.touch { display: none; justify-content: space-between; gap: 12px; user-select: none; -webkit-user-select: none; }
.touch .grp { display: flex; gap: 12px; }
.touch button {
  font-family: var(--pixel); font-size: 18px; color: var(--ink);
  background: var(--bezel); border: 3px solid var(--line); border-radius: 14px;
  width: 72px; height: 64px; touch-action: none;
}
.touch button.jump { width: 110px; color: var(--accent); font-size: 12px; }
.touch button.on { background: var(--line); }
@media (pointer: coarse) { .touch { display: flex; } }
.help { display: flex; flex-wrap: wrap; gap: 8px 22px; color: var(--muted); font-size: 14px; }
.help span { display: inline-flex; align-items: center; gap: 6px; }
kbd {
  font-family: var(--pixel); font-size: 9px; color: var(--ink);
  background: var(--bezel); border: 1px solid var(--line); border-bottom-width: 3px;
  border-radius: 4px; padding: 4px 6px;
}
.btn {
  font-family: var(--pixel); font-size: 10px; color: var(--bg); background: var(--accent);
  border: 0; border-radius: 6px; padding: 10px 14px; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--ink); border: 2px solid var(--line); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>КОТОПРЫГ</h1>
    <p>Рыжий кот бежит по крышам за рыбой. Мыши мешают.</p>
  </header>

  <div class="screen">
    <canvas id="game" width="384" height="224" tabindex="0" aria-label="Игровой экран"></canvas>
  </div>

  <div class="touch" id="touch">
    <div class="grp">
      <button id="tl" aria-label="Влево">◀</button>
      <button id="tr" aria-label="Вправо">▶</button>
    </div>
    <button id="tj" class="jump" aria-label="Прыжок">ПРЫГ</button>
  </div>

  <div class="bar">
    <button class="btn" id="startBtn">Играть</button>
    <button class="btn ghost" id="demoBtn">Демо</button>
    <button class="btn ghost" id="muteBtn">Звук: вкл</button>
  </div>

  <div class="help">
    <span><kbd>←</kbd><kbd>→</kbd> бег</span>
    <span><kbd>ПРОБЕЛ</kbd> прыжок (держи, чтобы выше)</span>
    <span><kbd>P</kbd> пауза</span>
    <span><kbd>D</kbd> демо</span>
    <span>Прыгай мышам на голову. Бей коробки снизу.</span>
  </div>
</div>

<script>
(() => {
const T = 16, W = 384, H = 224, ROWS = 14;
const cv = document.getElementById('game');
const cx = cv.getContext('2d');
cx.imageSmoothingEnabled = false;

// ---------- sprites ----------
function sprite(rows, pal) {
  const c = document.createElement('canvas');
  c.width = rows[0].length; c.height = rows.length;
  const g = c.getContext('2d');
  rows.forEach((r, y) => [...r].forEach((ch, x) => { if (pal[ch]) { g.fillStyle = pal[ch]; g.fillRect(x, y, 1, 1); } }));
  return c;
}
function flip(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const g = c.getContext('2d');
  g.translate(src.width, 0); g.scale(-1, 1); g.drawImage(src, 0, 0);
  return c;
}
const CAT_PAL = { o: '#f39237', d: '#c25d1c', w: '#fff1dc', g: '#8dff6a', p: '#ff8fb1' };
const CAT_TOP = [
  '...........o..o.',
  'o.........oooooo',
  'o.........ogoogo',
  'o.........oowpwo',
  '.oodoodoodoooww.',
  '..oooooooooooww.',
  '..odoodoodoooo..',
  '..wwwwwwwwwwoo..',
];
const CAT_LEGS = {
  stand: ['..oo..oo..oo.oo.', '..ww..ww..ww.ww.'],
  run1:  ['.oo....oo...oo..', '.ww....ww...ww..'],
  run2:  ['...oo.oo...oooo.', '...ww.ww...ww.ww'],
  jump:  ['.oo.........ooo.', 'ww............ww'],
};
const CAT = {};
for (const k in CAT_LEGS) {
  const r = sprite(CAT_TOP.concat(CAT_LEGS[k]), CAT_PAL);
  CAT[k] = { r, l: flip(r) };
}
const MOUSE_PAL = { g: '#9aa0b5', p: '#ffa3c0', k: '#15101f', l: '#d9dce8' };
const MOUSE_TOP = ['.pp.......', 'pggg......', 'gkgggggg..', 'pggggggg..', '.ggggggg.p'];
const MOUSE = [
  sprite(MOUSE_TOP.concat(['..k..k..pp']), MOUSE_PAL),
  sprite(MOUSE_TOP.concat(['...k..k.p.']), MOUSE_PAL),
];
const MOUSE_R = MOUSE.map(flip);
const FISH = sprite(['..bbb..b', '.bbbbbbb', 'bwbbbbb.', '.bbbbbbb', '..bbb..b'], { b: '#5fc8ff', w: '#ffffff' });

// ---------- level ----------
function rng(seed) {
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function buildLevel(n) {
  const r = rng(n * 9973 + 7);
  const grid = [], fish = [], mice = [];
  let gy = 10;
  const col = (h) => {
    const c = Array(ROWS).fill(' ');
    if (h != null) for (let y = h; y < ROWS; y++) c[y] = y === h ? 'R' : 'B';
    grid.push(c);
    return c;
  };
  for (let i = 0; i < 9; i++) col(gy);
  const len = 120 + Math.min(n, 8) * 20;
  const gapChance = Math.min(0.24, 0.15 + n * 0.02);
  while (grid.length < len) {
    const k = r();
    if (k < gapChance) {
      const w = 2 + (r() < 0.35 + n * 0.05 ? 1 : 0), x0 = grid.length;
      for (let i = 0; i < w; i++) col(null);
      for (let i = 0; i < w; i++) fish.push({ x: (x0 + i) * T + 4, y: (gy - 4) * T + 4 });
      for (let i = 0; i < 3; i++) col(gy);
    } else if (k < 0.36) {
      const d = (r() < 0.5 ? -1 : 1) * (r() < 0.4 ? 2 : 1);
      gy = Math.max(7, Math.min(11, gy + d));
      const m = 3 + Math.floor(r() * 3);
      for (let i = 0; i < m; i++) col(gy);
    } else if (k < 0.54) {
      const m = 7 + Math.floor(r() * 3), x0 = grid.length;
      for (let i = 0; i < m; i++) col(gy);
      const py = gy - 4, pl = 3 + Math.floor(r() * 2), px = x0 + 2;
      for (let i = 0; i < pl; i++) { grid[px + i][py] = 'P'; fish.push({ x: (px + i) * T + 4, y: (py - 1) * T + 6 }); }
      if (r() < 0.6) grid[px - 1][py] = '?';
    } else if (k < 0.68) {
      const h = 1 + (r() < 0.45 ? 1 : 0);
      col(gy); col(gy);
      for (let i = 0; i < 2; i++) { const c = col(gy); for (let y = gy - h; y < gy; y++) c[y] = 'C'; }
      fish.push({ x: (grid.length - 2) * T + 12, y: (gy - h - 2) * T });
      col(gy); col(gy);
    } else {
      const m = 6 + Math.floor(r() * 4), x0 = grid.length;
      for (let i = 0; i < m; i++) col(gy);
      if (r() < 0.55 + n * 0.1) mice.push(newMouse((x0 + m - 2) * T, (gy - 1) * T));
      if (r() < 0.5) for (let i = 1; i < 4; i++) fish.push({ x: (x0 + i) * T + 4, y: (gy - 2) * T + 4 });
    }
  }
  for (let i = 0; i < 14; i++) col(gy);
  const goalX = (grid.length - 7) * T;
  return { n, grid, fish, mice, goal: { x: goalX, y: (gy - 6) * T, top: gy - 6, base: gy }, width: grid.length * T, bumps: {} };
}
function newMouse(x, y) { return { x, y: y + 9, w: 10, h: 7, vx: -0.6, vy: 0, dead: false, onGround: false, f: 0 }; }

const SOLID = new Set(['R', 'B', 'P', 'C', '?', 'X']);
let L;
function tile(c, r) { if (c < 0) return 'B'; if (c >= L.grid.length || r < 0 || r >= ROWS) return ' '; return L.grid[c][r]; }
function solid(c, r) { return SOLID.has(tile(c, r)); }

// ---------- physics ----------
function moveX(o) {
  o.x += o.vx; o.hitWall = false;
  const top = Math.floor(o.y / T), bot = Math.floor((o.y + o.h - 0.01) / T);
  if (o.vx > 0) {
    const c = Math.floor((o.x + o.w) / T);
    for (let r = top; r <= bot; r++) if (solid(c, r)) { o.x = c * T - o.w - 0.01; o.hitWall = true; break; }
  } else if (o.vx < 0) {
    const c = Math.floor(o.x / T);
    for (let r = top; r <= bot; r++) if (solid(c, r)) { o.x = (c + 1) * T; o.hitWall = true; break; }
  }
}
function moveY(o) {
  o.y += o.vy; o.onGround = false; o.bonk = null;
  const l = Math.floor(o.x / T), rr = Math.floor((o.x + o.w - 0.01) / T);
  if (o.vy > 0) {
    const r = Math.floor((o.y + o.h) / T);
    for (let c = l; c <= rr; c++) if (solid(c, r)) { o.y = r * T - o.h - 0.01; o.vy = 0; o.onGround = true; break; }
  } else if (o.vy < 0) {
    const r = Math.floor(o.y / T);
    const mid = Math.floor((o.x + o.w / 2) / T);
    for (const c of [mid, l, rr]) if (solid(c, r)) { o.y = (r + 1) * T; o.vy = 0; o.bonk = { c, r }; break; }
  }
}

// ---------- state ----------
const G = {
  mode: 'demo', phase: 'run', t: 0, level: 1, lives: 3, score: 0, fish: 0,
  hi: 0, paused: false, timer: 0, cam: 0, parts: [], pops: [], demoDeaths: 0,
};
try { G.hi = +localStorage.getItem('kotoprig-hi') || 0; } catch (e) {}
let P;
const ai = { hold: false, bestX: 0, stuck: 0 };

function startLevel() {
  L = buildLevel(G.level);
  P = { x: 3 * T, y: 9 * T - 10, w: 12, h: 10, vx: 0, vy: 0, face: 1, onGround: false, coyote: 0, buf: 0, anim: 0 };
  G.phase = 'run'; G.timer = 0; G.parts = []; G.pops = []; G.cam = 0;
  ai.hold = false; ai.bestX = P.x; ai.stuck = 0;
}
function newGame(mode) {
  G.mode = mode; G.level = 1; G.lives = 3; G.score = 0; G.fish = 0; G.paused = false; G.demoDeaths = 0;
  startLevel();
  updateButtons();
}

// ---------- input ----------
const keys = {};
const touch = { l: false, r: false, j: false };
let prevJump = false;

function humanInput() {
  return {
    l: keys.ArrowLeft || keys.KeyA || touch.l,
    r: keys.ArrowRight || keys.KeyD || touch.r,
    j: keys.Space || keys.ArrowUp || keys.KeyW || keys.KeyZ || touch.j,
  };
}

function aiInput() {
  const inp = { l: false, r: true, j: false };
  if (G.phase !== 'run') return inp;
  const front = P.x + P.w;
  const footRow = Math.floor((P.y + P.h + 1) / T);
  const c = Math.floor((front + 3) / T);
  let gap = true;
  for (let r = footRow; r < ROWS; r++) if (solid(c, r)) { gap = false; break; }
  const cw = Math.floor((front + 10) / T);
  const wall = solid(cw, Math.floor((P.y + 1) / T)) || solid(cw, Math.floor((P.y + P.h - 1) / T));
  let enemy = false;
  for (const m of L.mice) {
    if (m.dead) continue;
    const dx = m.x - front;
    if (dx > -6 && dx < 40 && Math.abs((m.y + m.h) - (P.y + P.h)) < 20) enemy = true;
  }
  if (P.x > ai.bestX + 4) { ai.bestX = P.x; ai.stuck = 0; } else ai.stuck++;
  const stuck = ai.stuck > 50 && ai.stuck % 40 < 20;
  if (P.onGround && !ai.hold && (gap || wall || enemy || stuck)) ai.hold = true;
  if (ai.hold) {
    inp.j = true;
    if (!P.onGround && P.vy >= 0) ai.hold = false;
  }
  return inp;
}

// ---------- audio ----------
let actx = null, muted = false;
try { muted = localStorage.getItem('kotoprig-mute') === '1'; } catch (e) {}
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function beep(f1, f2, dur, type = 'square', vol = 0.08) {
  if (muted || !actx || G.mode === 'demo') return;
  const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t0); o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur);
}
const sfx = {
  jump: () => beep(300, 620, 0.12),
  fish: () => { beep(880, 1320, 0.08, 'triangle', 0.1); },
  stomp: () => beep(220, 80, 0.15, 'square', 0.1),
  hurt: () => beep(500, 60, 0.5, 'sawtooth', 0.08),
  box: () => beep(160, 120, 0.08, 'square', 0.1),
  win: () => { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, f, 0.15, 'triangle', 0.1), i * 110)); },
};

// ---------- update ----------
function burst(x, y, color, n = 6) {
  for (let i = 0; i < n; i++) G.parts.push({ x, y, vx: (Math.random() - 0.5) * 3, vy: -Math.random() * 3, life: 30, color });
}

function die() {
  if (G.phase !== 'run') return;
  G.phase = 'dying'; G.timer = 0; P.vy = -6; sfx.hurt();
}

function step() {
  G.t++;
  if (G.paused) return;
  const inp = G.mode === 'demo' ? aiInput() : humanInput();
  const jPress = inp.j && !prevJump;
  prevJump = inp.j;

  if (G.phase === 'run') {
    const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    const max = 2.2;
    if (dir) { P.vx += dir * 0.3; P.face = dir; } else P.vx *= 0.75;
    if (Math.abs(P.vx) < 0.05) P.vx = 0;
    P.vx = Math.max(-max, Math.min(max, P.vx));
    P.coyote = P.onGround ? 6 : P.coyote - 1;
    P.buf = jPress ? 7 : P.buf - 1;
    if (P.buf > 0 && P.coyote > 0) { P.vy = -7.6; P.buf = 0; P.coyote = 0; sfx.jump(); }
    P.vy += 0.42;
    if (!inp.j && P.vy < -2.5) P.vy = -2.5;
    P.vy = Math.min(P.vy, 7.5);
    moveX(P);
    moveY(P);
    if (P.bonk) hitBlock(P.bonk.c, P.bonk.r);
    P.anim += Math.abs(P.vx) * 0.12;
    if (P.y > H + 16) die();

    for (const f of L.fish) {
      if (f.got) continue;
      if (P.x < f.x + 8 && P.x + P.w > f.x && P.y < f.y + 6 && P.y + P.h > f.y) {
        f.got = true; G.fish++; G.score += 10; sfx.fish(); burst(f.x + 4, f.y + 2, '#5fc8ff', 5);
      }
    }
    for (const m of L.mice) {
      if (m.dead || Math.abs(m.x - P.x) > W) continue;
      m.vy = Math.min(m.vy + 0.42, 7);
      moveX(m);
      if (m.hitWall) m.vx = -m.vx;
      moveY(m);
      if (m.onGround) {
        const ahead = m.vx < 0 ? m.x - 1 : m.x + m.w + 1;
        if (!solid(Math.floor(ahead / T), Math.floor((m.y + m.h + 2) / T))) m.vx = -m.vx;
      }
      m.f += 0.15;
      if (m.y > H + 16) m.dead = true;
      if (P.x + 2 < m.x + m.w && P.x + P.w - 2 > m.x && P.y + 2 < m.y + m.h && P.y + P.h > m.y + 1) {
        if (P.vy > 0 && P.y + P.h - m.y < 11) {
          m.dead = true; P.vy = -5; G.score += 50; sfx.stomp(); burst(m.x + 5, m.y + 3, '#d9dce8', 8);
          G.pops.push({ x: m.x, y: m.y - 4, text: '50', life: 40 });
        } else die();
      }
    }
    const g = L.goal;
    if (P.x + P.w > g.x + 6) {
      G.phase = 'clear'; G.timer = 0; G.score += 200; sfx.win();
      G.pops.push({ x: g.x - 6, y: g.y - 6, text: '200', life: 60 });
    }
    if (G.mode === 'demo' && ai.stuck > 600) die();
  } else if (G.phase === 'dying') {
    G.timer++; P.vy += 0.3; P.y += P.vy;
    if (G.timer > 80) {
      if (G.mode === 'demo') { G.demoDeaths++; G.level = G.level % 10 + 1; startLevel(); }
      else if (--G.lives > 0) startLevel();
      else { G.phase = 'over'; G.timer = 0; saveHi(); }
    }
  } else if (G.phase === 'clear') {
    G.timer++;
    P.vx = 1.2; P.face = 1; P.vy += 0.42; moveX(P); moveY(P); P.anim += 0.15;
    if (G.timer > 130) { G.level = G.mode === 'demo' ? G.level % 10 + 1 : G.level + 1; startLevel(); }
  } else if (G.phase === 'over') {
    G.timer++;
    if (G.timer > 420) newGame('demo');
  }

  for (const p of G.parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const p of G.pops) { p.y -= 0.5; p.life--; }
  G.pops = G.pops.filter(p => p.life > 0);
  for (const k in L.bumps) if (--L.bumps[k] <= 0) delete L.bumps[k];

  const target = Math.max(0, Math.min(L.width - W, P.x - W * 0.38));
  G.cam += (target - G.cam) * 0.2;
}

function hitBlock(c, r) {
  if (tile(c, r) === '?') {
    L.grid[c][r] = 'X'; L.bumps[c + ',' + r] = 10;
    G.fish += 3; G.score += 30; sfx.box();
    G.pops.push({ x: c * T, y: r * T - 10, text: '+3', life: 45, fish: true });
    // knock out a mouse standing on the box
    for (const m of L.mice) if (!m.dead && Math.abs(m.x + 5 - (c * T + 8)) < 14 && Math.abs(m.y + m.h - r * T) < 3) { m.dead = true; G.score += 50; }
  } else sfx.box();
}

function saveHi() {
  if (G.score > G.hi) { G.hi = G.score; try { localStorage.setItem('kotoprig-hi', G.hi); } catch (e) {} }
}

// ---------- background ----------
function makeSkyline(seed, count, minH, maxH) {
  const r = rng(seed), out = [];
  let x = 0;
  for (let i = 0; i < count; i++) {
    const w = 28 + Math.floor(r() * 50), h = minH + Math.floor(r() * (maxH - minH));
    const win = [];
    for (let wy = 8; wy < h - 6; wy += 9) for (let wx = 5; wx < w - 6; wx += 8) if (r() < 0.22) win.push([wx, wy]);
    out.push({ x, w, h, win, ant: r() < 0.25 });
    x += w + Math.floor(r() * 8);
  }
  return { list: out, period: x };
}
const FAR = makeSkyline(11, 30, 50, 120), NEAR = makeSkyline(29, 24, 30, 80);
const STARS = Array.from({ length: 60 }, (_, i) => { const r = rng(i + 400); return [r() * W, r() * 110, r()]; });

function drawSkyline(sl, f, base, color, winColor) {
  const off = -((G.cam * f) % sl.period);
  for (let rep = 0; rep < 2; rep++) {
    for (const b of sl.list) {
      const x = Math.round(off + b.x + rep * sl.period);
      if (x > W || x + b.w < 0) continue;
      cx.fillStyle = color; cx.fillRect(x, base - b.h, b.w, b.h);
      if (b.ant) cx.fillRect(x + (b.w >> 1), base - b.h - 10, 1, 10);
      cx.fillStyle = winColor;
      for (const [wx, wy] of b.win) cx.fillRect(x + wx, base - b.h + wy, 3, 4);
    }
  }
}

let skyGrad;
function drawBg() {
  if (!skyGrad) {
    skyGrad = cx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#0d0920'); skyGrad.addColorStop(0.6, '#2b1b4d'); skyGrad.addColorStop(1, '#4a2a5e');
  }
  cx.fillStyle = skyGrad; cx.fillRect(0, 0, W, H);
  for (const [x, y, k] of STARS) {
    const tw = (Math.sin(G.t * 0.03 + k * 20) + 1) / 2;
    cx.fillStyle = tw > 0.6 ? '#ffffff' : '#8a7bb8';
    cx.fillRect(Math.round((x - G.cam * 0.02 + W * 10) % W), Math.round(y), 1, 1);
  }
  const mx = 300 - Math.round(G.cam * 0.03) % 40;
  cx.fillStyle = '#fff3c4'; cx.beginPath(); cx.arc(mx, 40, 16, 0, Math.PI * 2); cx.fill();
  cx.fillStyle = '#efdca0'; cx.fillRect(mx - 6, 34, 4, 3); cx.fillRect(mx + 4, 44, 3, 3);
  drawSkyline(FAR, 0.15, H, '#231841', '#5a4a2a');
  drawSkyline(NEAR, 0.35, H, '#1a1230', '#c9a24a');
}

// ---------- tiles ----------
function hash(c, r) { return ((c * 73856093) ^ (r * 19349663)) >>> 0; }
function drawTile(ch, c, r, x, y) {
  if (ch === 'R') {
    cx.fillStyle = '#9e3f2a'; cx.fillRect(x, y, T, T);
    cx.fillStyle = '#d9643f'; cx.fillRect(x, y, T, 3);
    cx.fillStyle = '#7a2a1c';
    for (let i = 0; i < 4; i++) cx.fillRect(x + i * 4 + ((r & 1) ? 2 : 0), y + 4, 1, 5);
    cx.fillRect(x, y + 9, T, 1);
    for (let i = 0; i < 4; i++) cx.fillRect(x + i * 4 + 2, y + 10, 1, 6);
  } else if (ch === 'B') {
    cx.fillStyle = '#3b2a52'; cx.fillRect(x, y, T, T);
    cx.fillStyle = '#2c1f3f';
    cx.fillRect(x, y + 7, T, 1); cx.fillRect(x, y + 15, T, 1);
    cx.fillRect(x + ((r & 1) ? 4 : 11), y, 1, 7); cx.fillRect(x + ((r & 1) ? 11 : 4), y + 8, 1, 7);
    if (hash(c, r) % 9 === 0 && tile(c, r - 1) === 'B') {
      cx.fillStyle = '#ffcf6b'; cx.fillRect(x + 4, y + 3, 8, 9);
      cx.fillStyle = '#3b2a52'; cx.fillRect(x + 7, y + 3, 1, 9); cx.fillRect(x + 4, y + 7, 8, 1);
    }
  } else if (ch === 'C') {
    const cap = tile(c, r - 1) !== 'C';
    cx.fillStyle = '#8a3b2c'; cx.fillRect(x, y, T, T);
    cx.fillStyle = '#6b2b20';
    cx.fillRect(x, y + 5, T, 1); cx.fillRect(x, y + 11, T, 1); cx.fillRect(x + (c & 1 ? 6 : 12), y + 6, 1, 5);
    if (cap) { cx.fillStyle = '#5a4a6a'; cx.fillRect(x - 1, y, T + 2, 3); }
  } else if (ch === 'P') {
    cx.fillStyle = '#8b5a2b'; cx.fillRect(x, y, T, 7);
    cx.fillStyle = '#b07a3f'; cx.fillRect(x, y, T, 2);
    cx.fillStyle = '#5c3a1a'; cx.fillRect(x + 2, y + 3, 1, 1); cx.fillRect(x + 13, y + 3, 1, 1); cx.fillRect(x, y + 6, T, 1);
  } else if (ch === '?' || ch === 'X') {
    const b = L.bumps[c + ',' + r] || 0;
    const yy = y - (b > 5 ? 10 - b : b) ;
    const full = ch === '?';
    cx.fillStyle = full ? '#c8945a' : '#7d5a3a'; cx.fillRect(x, yy, T, T);
    cx.fillStyle = full ? '#e9c48c' : '#8f6a48'; cx.fillRect(x, yy, T, 2); cx.fillRect(x + 7, yy, 2, T);
    cx.fillStyle = '#5c3a1a'; cx.fillRect(x, yy + T - 1, T, 1);
    if (full) {
      const glow = (Math.sin(G.t * 0.1) + 1) / 2 > 0.5;
      cx.fillStyle = glow ? '#3d2410' : '#5c3a1a';
      cx.fillRect(x + 2, yy + 9, 3, 3); cx.fillRect(x + 11, yy + 9, 3, 3);
      cx.fillRect(x + 1, yy + 6, 1, 2); cx.fillRect(x + 4, yy + 5, 1, 2); cx.fillRect(x + 11, yy + 5, 1, 2); cx.fillRect(x + 14, yy + 6, 1, 2);
    }
  }
}

// ---------- draw ----------
function text(s, x, y, size, color, align = 'left') {
  cx.font = size + 'px "Press Start 2P", monospace';
  cx.textAlign = align; cx.textBaseline = 'top';
  cx.fillStyle = '#0d0920'; cx.fillText(s, x + 1, y + 1);
  cx.fillStyle = color; cx.fillText(s, x, y);
}

function draw() {
  drawBg();
  const cam = Math.round(G.cam);
  const c0 = Math.floor(cam / T), c1 = c0 + Math.ceil(W / T) + 1;
  for (let c = c0; c <= c1; c++) for (let r = 0; r < ROWS; r++) {
    const ch = tile(c, r);
    if (ch !== ' ') drawTile(ch, c, r, c * T - cam, r * T);
  }
  // goal: pole with a fish flag and a bowl
  const g = L.goal, gx = g.x - cam;
  if (gx > -40 && gx < W + 40) {
    cx.fillStyle = '#d8d0e8'; cx.fillRect(gx + 7, g.y, 2, (g.base - g.top) * T);
    cx.fillStyle = '#ffd36b'; cx.fillRect(gx + 6, g.y - 3, 4, 4);
    const wave = Math.round(Math.sin(G.t * 0.12) * 1.5);
    cx.drawImage(FISH, gx - 2 + wave, g.y + 3, 8, 5);
    cx.save(); cx.translate(gx + 10, g.y + 3); cx.scale(2, 2); cx.drawImage(flip(FISH), 0, 0); cx.restore();
    const by = g.base * T;
    cx.fillStyle = '#ff6b9a'; cx.fillRect(gx + 18, by - 6, 18, 6);
    cx.fillStyle = '#ff9ec0'; cx.fillRect(gx + 16, by - 7, 22, 2);
    cx.fillStyle = '#c94a75'; cx.fillRect(gx + 20, by - 2, 14, 2);
  }
  for (const f of L.fish) {
    if (f.got) continue;
    const x = Math.round(f.x - cam);
    if (x < -10 || x > W) continue;
    cx.drawImage(FISH, x, Math.round(f.y + Math.sin(G.t * 0.08 + f.x) * 1.5));
  }
  for (const m of L.mice) {
    if (m.dead) continue;
    const x = Math.round(m.x - cam);
    if (x < -12 || x > W) continue;
    const fr = Math.floor(m.f) % 2;
    cx.drawImage(m.vx < 0 ? MOUSE[fr] : MOUSE_R[fr], x, Math.round(m.y) - 1);
  }
  // cat
  let fr = 'stand';
  if (G.phase === 'dying') fr = 'jump';
  else if (!P.onGround) fr = 'jump';
  else if (Math.abs(P.vx) > 0.3) fr = Math.floor(P.anim) % 2 ? 'run1' : 'run2';
  const spr = P.face > 0 ? CAT[fr].r : CAT[fr].l;
  const px = Math.round(P.x - cam - 2), py = Math.round(P.y);
  if (G.phase === 'dying') {
    cx.save(); cx.translate(px + 8, py + 5); cx.scale(1, -1); cx.drawImage(spr, -8, -5); cx.restore();
  } else cx.drawImage(spr, px, py);

  for (const p of G.parts) { cx.fillStyle = p.color; cx.fillRect(Math.round(p.x - cam), Math.round(p.y), 2, 2); }
  for (const p of G.pops) {
    if (p.fish) cx.drawImage(FISH, Math.round(p.x - cam) - 2, Math.round(p.y));
    text(p.text, Math.round(p.x - cam) + (p.fish ? 8 : 0), Math.round(p.y), 8, '#ffffff');
  }

  // HUD
  text('СЧЁТ ' + String(G.score).padStart(5, '0'), 8, 8, 8, '#ffffff');
  cx.drawImage(FISH, 118, 9); text('×' + G.fish, 128, 8, 8, '#5fc8ff');
  text('УР ' + G.level, 180, 8, 8, '#ffd36b');
  if (G.mode === 'play') for (let i = 0; i < G.lives; i++) cx.drawImage(CAT.stand.r, W - 22 - i * 18, 4);
  else text('РЕКОРД ' + G.hi, W - 8, 8, 8, '#a898c4', 'right');

  if (G.mode === 'demo') {
    cx.fillStyle = 'rgba(13,9,32,0.55)'; cx.fillRect(0, 40, W, 80);
    text('КОТОПРЫГ', W / 2, 50, 24, '#ff9f43', 'center');
    if (Math.floor(G.t / 30) % 2) text('НАЖМИ ЛЮБУЮ КЛАВИШУ', W / 2, 88, 8, '#ffffff', 'center');
    text('ИЛИ ТАПНИ ПО ЭКРАНУ', W / 2, 102, 8, '#a898c4', 'center');
    text('ДЕМО', W - 8, 22, 8, Math.floor(G.t / 20) % 2 ? '#ff6b9a' : '#ffffff', 'right');
  }
  if (G.phase === 'clear') text('УРОВЕНЬ ПРОЙДЕН!', W / 2, 92, 12, '#8dff6a', 'center');
  if (G.phase === 'over') {
    cx.fillStyle = 'rgba(13,9,32,0.7)'; cx.fillRect(0, 0, W, H);
    text('ИГРА ОКОНЧЕНА', W / 2, 80, 16, '#ff6b9a', 'center');
    text('СЧЁТ ' + G.score + '   РЕКОРД ' + G.hi, W / 2, 110, 8, '#ffffff', 'center');
    if (Math.floor(G.t / 30) % 2) text('НАЖМИ, ЧТОБЫ СЫГРАТЬ ЕЩЁ', W / 2, 132, 8, '#ffd36b', 'center');
  }
  if (G.paused) {
    cx.fillStyle = 'rgba(13,9,32,0.6)'; cx.fillRect(0, 0, W, H);
    text('ПАУЗА', W / 2, 100, 16, '#ffffff', 'center');
  }
}

// ---------- loop ----------
let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(frame);
}

// ---------- controls ----------
const startBtn = document.getElementById('startBtn');
const demoBtn = document.getElementById('demoBtn');
const muteBtn = document.getElementById('muteBtn');
function updateButtons() {
  startBtn.textContent = G.mode === 'play' ? 'Заново' : 'Играть';
  muteBtn.textContent = muted ? 'Звук: выкл' : 'Звук: вкл';
}
function begin() { audio(); newGame('play'); cv.focus(); }

const GAME_KEYS = ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Space'];
addEventListener('keydown', (e) => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.code === 'Enter')) return;
  if (GAME_KEYS.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'KeyD' && G.mode === 'play' && G.phase !== 'run') { newGame('demo'); return; }
  if (e.code === 'KeyD' && G.mode === 'demo') return;
  if (e.code === 'KeyP' && G.mode === 'play') { G.paused = !G.paused; return; }
  if (e.code === 'KeyM') { toggleMute(); return; }
  if (G.mode === 'demo' || G.phase === 'over') { begin(); return; }
  keys[e.code] = true;
});
addEventListener('keyup', (e) => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
document.addEventListener('visibilitychange', () => { if (document.hidden && G.mode === 'play' && G.phase === 'run') G.paused = true; });

cv.addEventListener('pointerdown', () => {
  if (G.mode === 'demo' || G.phase === 'over') begin();
  else if (G.paused) G.paused = false;
});
startBtn.addEventListener('click', begin);
demoBtn.addEventListener('click', () => { newGame('demo'); });
function toggleMute() {
  muted = !muted;
  try { localStorage.setItem('kotoprig-mute', muted ? '1' : '0'); } catch (e) {}
  updateButtons();
}
muteBtn.addEventListener('click', toggleMute);

function bindTouch(id, k) {
  const el = document.getElementById(id);
  const on = (e) => {
    e.preventDefault(); audio();
    if (G.mode === 'demo' || G.phase === 'over') { begin(); return; }
    touch[k] = true; el.classList.add('on');
  };
  const off = () => { touch[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on);
  el.addEventListener('pointerup', off);
  el.addEventListener('pointercancel', off);
  el.addEventListener('pointerleave', off);
}
bindTouch('tl', 'l'); bindTouch('tr', 'r'); bindTouch('tj', 'j');

// test hook: advance the simulation without rendering
window.KOTOPRIG = { G, step, get player() { return P; }, get level() { return L; } };

newGame('demo');
updateButtons();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
